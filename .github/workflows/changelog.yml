name: Changelog

on:
  # Weekly refresh + manual trigger only. Running on every push triggers
  # PR-creation loops (merge of PR opens a new PR for next commit).
  schedule:
    - cron: "0 6 * * MON"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    name: Refresh the generated commit digest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Regenerates git-cliff/CHANGELOG.md whole, every run. It is a digest of
      # what has landed since the last tag, not the changelog: CHANGELOG.md is
      # written by hand, and this job must never touch it.
      #
      # It used to run `--prepend CHANGELOG.md`, which appends a fresh
      # `## [Unreleased]` block without removing the one the previous run
      # added. Nothing fails when that happens — the file just grows a
      # duplicate heading and a re-listing of the same commits every Monday,
      # which is how CHANGELOG.md ended up with two Unreleased sections.
      - name: Generate commit digest
        uses: orhun/git-cliff-action@f50e11560dce63f7c33227798f90b924471a88b5 # v4.8.0
        with:
          config: cliff.toml
          args: --unreleased --output git-cliff/CHANGELOG.md

      - name: Fail if CHANGELOG.md was modified
        run: |
          if ! git diff --quiet -- CHANGELOG.md; then
            echo "::error::this job modified the hand-written CHANGELOG.md; it must only write git-cliff/CHANGELOG.md"
            git diff -- CHANGELOG.md
            exit 1
          fi

      - name: Open PR with the refreshed digest
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          # A PR opened with the default GITHUB_TOKEN does not trigger
          # workflows — GitHub blocks that to prevent a job from recursively
          # triggering itself. main requires four status checks, so the weekly
          # PR arrived with none of them reported and could never merge: a bot
          # opening an unmergeable PR every Monday, indefinitely.
          #
          # NOX_TOKEN is a PAT, so its PR triggers CI like any other and the
          # required checks actually report. Falls back to GITHUB_TOKEN, which
          # still opens the PR — it just needs an admin merge.
          token: ${{ secrets.NOX_TOKEN || github.token }}
          commit-message: "chore(changelog): refresh the generated commit digest"
          title: "chore(changelog): refresh the generated commit digest"
          body: |
            `git-cliff` digest of the conventional commits since the last tag,
            regenerated whole. This is `git-cliff/CHANGELOG.md` only — the
            hand-written `CHANGELOG.md` is never touched by automation.

            Use it as the checklist when writing the release's `## [Unreleased]`
            entries by hand.
          add-paths: git-cliff/CHANGELOG.md
          branch: chore/changelog-refresh
          delete-branch: true
