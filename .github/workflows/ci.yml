# Thin caller for the shared klarlabs-studio Go CI bar.
# All gate logic lives in the reusable workflow — bump versions / add jobs
# there, once, org-wide.
name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    branches: [main]
    # No paths-ignore here: branch protection requires this workflow's status
    # checks (ci / Lint, Test, Build, Security (nox)), and a docs-only PR that
    # skips the whole workflow never reports them — so the PR is unmergeable
    # forever without an admin override. Running CI on docs PRs is cheap (no
    # code changed → cache hits) and keeps them mergeable; the push trigger
    # above still skips docs, saving minutes on merges.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: klarlabs-studio/.github/.github/workflows/go-ci.yml@main
    permissions:
      contents: read
      security-events: write
      pull-requests: write
    secrets: inherit
    with:
      coverage: true
      # cross-platform OFF: fortify is pure-Go resilience code with no
      # OS-specific paths/syscalls/build-tags, so a macOS (10x billing) +
      # Windows matrix on every push to main validated nothing — Go's own
      # runtime guarantees identical behaviour. This was the bulk of the repo's
      # Actions spend. Re-enable only if OS-specific source is ever added.
      cross-platform: false
      # benchmark OFF here: the dedicated weekly performance.yml already runs
      # `go test -bench` with history comparison (gh-pages). Running it again on
      # every push to main was redundant.
      benchmark: false
